<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>open-pixel-art — run gallery</title>
<meta name="description" content="Every run of the open-pixel-art harness, rendered.">
<style>
  :root {
    --bg: #0d0f14;
    --panel: #151922;
    --line: #242a36;
    --ink: #e6e9ef;
    --dim: #8d95a5;
    --accent: #f4d35e;
    --agent: #7bd88f;
    --script: #6bb8f0;
    --mono: ui-monospace, SFMono-Regular, Menlo, "DejaVu Sans Mono", monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--mono); font-size: 14px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  header {
    padding: 28px 24px 20px; border-bottom: 1px solid var(--line);
    display: flex; flex-wrap: wrap; gap: 16px; align-items: baseline;
  }
  h1 { margin: 0; font-size: 18px; letter-spacing: .02em; }
  h1 span { color: var(--accent); }
  .sub { color: var(--dim); font-size: 12px; }
  .sub a { color: var(--dim); }
  main { padding: 24px; max-width: 1200px; margin: 0 auto; }

  .stats { display: flex; flex-wrap: wrap; gap: 24px; margin-bottom: 24px; }
  .stat b { display: block; font-size: 22px; color: var(--accent); font-weight: 600; }
  .stat span { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }

  .filters { display: flex; gap: 8px; margin-bottom: 20px; }
  .filters button {
    font: inherit; font-size: 12px; color: var(--dim); background: var(--panel);
    border: 1px solid var(--line); border-radius: 4px; padding: 4px 12px; cursor: pointer;
  }
  .filters button[aria-pressed="true"] { color: var(--bg); background: var(--ink); border-color: var(--ink); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    padding: 14px; cursor: pointer; text-align: left; font: inherit; color: inherit;
  }
  .card:hover { border-color: var(--accent); }
  .stage {
    display: grid; place-items: center; height: 176px; margin-bottom: 12px;
    background:
      repeating-conic-gradient(#1b202b 0 25%, #12161e 0 50%) 0 0 / 16px 16px;
    border-radius: 4px; overflow: hidden;
  }
  .sprite { image-rendering: pixelated; background-repeat: no-repeat; }
  .subject { font-size: 13px; margin-bottom: 6px; }
  .meta { color: var(--dim); font-size: 11px; display: flex; gap: 8px; flex-wrap: wrap; }
  .tag { border-radius: 3px; padding: 0 6px; color: var(--bg); font-weight: 600; }
  .tag.agent { background: var(--agent); }
  .tag.script { background: var(--script); }
  .warn { color: var(--accent); }

  .empty {
    border: 1px dashed var(--line); border-radius: 6px; padding: 32px;
    color: var(--dim); text-align: center;
  }
  .empty b { color: var(--ink); display: block; margin-bottom: 8px; font-weight: 600; }
  .empty a { color: var(--accent); }

  dialog {
    background: var(--panel); color: var(--ink); border: 1px solid var(--line);
    border-radius: 8px; padding: 0; max-width: 620px; width: calc(100% - 32px);
  }
  dialog::backdrop { background: rgba(0,0,0,.7); }
  .dlg-body { padding: 20px; }
  .dlg-body h2 { margin: 0 0 4px; font-size: 15px; }
  .dlg-body .id { color: var(--dim); font-size: 11px; margin-bottom: 16px; word-break: break-all; }
  table { border-collapse: collapse; width: 100%; font-size: 12px; }
  td { padding: 4px 0; vertical-align: top; border-bottom: 1px solid var(--line); }
  td:first-child { color: var(--dim); width: 130px; }
  .palette { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 4px; }
  .swatch { width: 12px; height: 12px; border-radius: 2px; border: 1px solid rgba(255,255,255,.15); }
  .close { float: right; background: none; border: 0; color: var(--dim); font: inherit; cursor: pointer; }
</style>
</head>
<body>
<header>
  <h1>open-<span>pixel-art</span> · runs</h1>
  <div class="sub">
    every run the harness published, newest first ·
    <a href="https://github.com/neobeav/open-pixel-art-pages">source</a>
  </div>
</header>

<main>
  <div class="stats" id="stats" hidden>
    <div class="stat"><b id="s-runs">0</b><span>runs</span></div>
    <div class="stat"><b id="s-attempts">–</b><span>mean attempts</span></div>
    <div class="stat"><b id="s-agent">0</b><span>agent mode</span></div>
    <div class="stat"><b id="s-script">0</b><span>script mode</span></div>
    <div class="stat"><b id="s-cost">$0.00</b><span>total cost</span></div>
  </div>

  <div class="filters" id="filters" hidden>
    <button data-mode="all" aria-pressed="true">all</button>
    <button data-mode="agent" aria-pressed="false">agent</button>
    <button data-mode="script" aria-pressed="false">script</button>
  </div>

  <div class="grid" id="grid"></div>

  <div class="empty" id="empty" hidden>
    <b>No runs published yet.</b>
    The harness is being built in <code>neobeav/open-pixel-art</code> (private).
    New validated runs appear here as sandboxed sessions publish them.
  </div>
</main>

<dialog id="dlg"><div class="dlg-body">
  <button class="close" id="dlg-close">close ✕</button>
  <h2 id="d-subject"></h2>
  <div class="id" id="d-id"></div>
  <div class="stage" id="d-stage" style="height:220px"></div>
  <table id="d-table"></table>
</div></dialog>

<script type="module">
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[<>&"]/g, (c) => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));

/** Frames are played off the sheet with a steps() animation — no JS timer, no
 *  decoding per frame, and it stays correct if the tab is backgrounded. */
function sprite(run, boxPx) {
  const { width: w, height: h, frames: n } = run.sprite;
  const fps = run.animation?.fps || 12;
  const scale = Math.max(1, Math.floor(boxPx / Math.max(w, h)));
  const el = document.createElement('div');
  el.className = 'sprite';
  el.style.cssText = `width:${w}px;height:${h}px;` +
    `background-image:url("runs/${run.id}/${run.sheet || 'sheet.png'}");` +
    `background-size:${w * n}px ${h}px;` +
    `transform:scale(${scale});transform-origin:center;` +
    `animation:play-${n} ${(n / fps).toFixed(3)}s steps(${n}) infinite;`;
  if (!document.getElementById(`kf-${n}`)) {
    const st = document.createElement('style');
    st.id = `kf-${n}`;
    st.textContent = `@keyframes play-${n}{from{background-position:0 0}to{background-position:-${w * n}px 0}}`;
    document.head.appendChild(st);
  }
  return el;
}

function card(run) {
  const el = document.createElement('button');
  el.className = 'card';
  el.innerHTML =
    `<div class="stage"></div>` +
    `<div class="subject">${esc(run.subject)}</div>` +
    `<div class="meta">` +
      `<span class="tag ${run.mode === 'agent' ? 'agent' : 'script'}">${esc(run.mode)}</span>` +
      `<span>${run.sprite.width}×${run.sprite.height}</span>` +
      `<span>${run.sprite.frames}f</span>` +
      `<span class="${run.attempts > 1 ? 'warn' : ''}">${run.attempts}× try</span>` +
    `</div>`;
  el.querySelector('.stage').appendChild(sprite(run, 160));
  el.addEventListener('click', () => detail(run));
  return el;
}

function detail(run) {
  $('d-subject').textContent = run.subject;
  $('d-id').textContent = run.id;
  $('d-stage').replaceChildren(sprite(run, 200));
  const rows = [
    ['mode', esc(run.mode)],
    ['model', esc(run.model)],
    ['created', esc(run.created)],
    ['size', `${run.sprite.width}×${run.sprite.height}, ${run.sprite.frames} frames @ ${run.animation?.fps ?? '?'}fps`],
    ['attempts', String(run.attempts)],
    ['palette', `${run.sprite.palette?.length ?? 0} colours<div class="palette">` +
      (run.sprite.palette || []).map((c) => `<i class="swatch" style="background:${esc(c)}"></i>`).join('') + '</div>'],
    ['tokens', run.usage ? `${run.usage.input_tokens} in / ${run.usage.output_tokens} out` : '–'],
    ['cost', run.usage ? `$${(run.usage.cost_usd ?? 0).toFixed(4)}` : '–'],
    ['wall', run.usage?.wall_seconds != null ? `${run.usage.wall_seconds}s` : '–'],
    ['validator', (run.validation?.notes?.length ? run.validation.notes.map(esc).join('<br>') : 'clean')],
    ['sheet', `<a href="runs/${esc(run.id)}/${esc(run.sheet || 'sheet.png')}" style="color:var(--accent)">open png</a>`],
  ];
  $('d-table').innerHTML = rows.map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join('');
  $('dlg').showModal();
}

let runs = [];
let filter = 'all';

function render() {
  const shown = runs.filter((r) => filter === 'all' || r.mode === filter);
  $('grid').replaceChildren(...shown.map(card));
}

async function load() {
  let ids = [];
  try {
    const idx = await fetch('runs/index.json', { cache: 'no-cache' }).then((r) => r.json());
    ids = Array.isArray(idx) ? idx : (idx.runs || []);
  } catch { /* no index yet — the empty state below is the correct answer */ }

  // The index carries ids only; each manifest stays the single source of truth
  // for its own run, so the index can never drift out of step with it.
  runs = (await Promise.all(ids.map((id) =>
    fetch(`runs/${id}/manifest.json`, { cache: 'no-cache' })
      .then((r) => r.json())
      .then((m) => ({ ...m, id: m.id || id }))
      .catch(() => null)
  ))).filter(Boolean);

  if (!runs.length) { $('empty').hidden = false; return; }

  $('stats').hidden = false;
  $('filters').hidden = false;
  $('s-runs').textContent = runs.length;
  $('s-attempts').textContent = (runs.reduce((a, r) => a + (r.attempts || 1), 0) / runs.length).toFixed(2);
  $('s-agent').textContent = runs.filter((r) => r.mode === 'agent').length;
  $('s-script').textContent = runs.filter((r) => r.mode === 'script').length;
  $('s-cost').textContent = '$' + runs.reduce((a, r) => a + (r.usage?.cost_usd || 0), 0).toFixed(2);
  render();
}

for (const b of $('filters').querySelectorAll('button')) {
  b.addEventListener('click', () => {
    filter = b.dataset.mode;
    for (const o of $('filters').querySelectorAll('button')) o.setAttribute('aria-pressed', String(o === b));
    render();
  });
}
$('dlg-close').addEventListener('click', () => $('dlg').close());

load();
</script>
</body>
</html>
